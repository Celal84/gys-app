&quot;Times New Roman&quot;,serif;font-style:normal">Açıktan atanmada aylığa hak kazanma:</span></b></p><p class="Nor" style="text-indent:35.45pt;line-height:127%"><b><span style="font-size:12.0pt;line-height:127%;font-family:&quot;Times New Roman&quot;,serif">Madde 165 – (Değişik: 23/12/1972 – KHK-2/1 md.)</span></b></p><p class="Nor" style="text-indent:35.45pt;line-height:127%"><span style="font-size:12.0pt;line-height:127%;font-family:&quot;Times New Roman&quot;,serif">Bir göreve açıktan aday veya asıl memur olarak atananlar, göreve başladıkları günden itibaren aylığa hak kazanırlar.</span></p><p class="Nor" style="text-indent:35.45pt;line-height:127%"><span style="font-size:12.0pt;line-height:127%;font-family:&quot;Times New Roman&quot;,serif">Bu suretle göreve başlamada ilk aylık, gün hesabiyle ay sonunda ödenir.</span></p>
